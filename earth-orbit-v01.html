<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地球公轉｜互動實驗</title>
  <script type="module" src="./modules/earth-orbit/earth-orbit-v01.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(circle at 10% 0,#f9e8ff,transparent 38%),radial-gradient(circle at 92% 0,#dff7ff,transparent 40%),#f4f2fb;color:#243052;font-family:system-ui,"Noto Sans TC",sans-serif}.acceptance{width:min(1360px,100%);margin:auto}.acceptance-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:10px}.acceptance-head p{margin:0 0 3px;color:#6855dc;font-size:10px;font-weight:900;letter-spacing:.16em}.acceptance-head h1{margin:0;font-size:clamp(24px,3vw,34px)}.acceptance-badge{border-radius:99px;padding:8px 13px;background:#dff8ed;color:#14714b;font-size:11px;font-weight:900}.earth-orbit-v01-shell{position:relative}.earth-orbit-v01-stage{position:relative;min-width:0;height:calc(100vh - 90px);min-height:520px;max-height:760px;overflow:hidden;border:3px solid #6154c8;border-radius:26px;background:#050b1d;box-shadow:0 18px 42px rgba(26,31,88,.3);touch-action:none}.earth-orbit-v01-canvas,.earth-orbit-v01-three-canvas{position:absolute;inset:0;display:block;width:100%;height:100%}.earth-orbit-v01-three-canvas{z-index:1;pointer-events:none}.earth-orbit-v01-hint{position:absolute;z-index:2;left:18px;top:18px;margin:0;padding:9px 13px;border:1px solid rgba(202,232,255,.45);border-radius:99px;background:rgba(8,18,54,.76);color:#eef8ff;font-size:12px;font-weight:900;pointer-events:none;backdrop-filter:blur(8px)}.earth-orbit-v01-actions{position:absolute;z-index:4;left:50%;bottom:16px;display:flex;gap:8px;transform:translateX(-50%);padding:7px;border:1px solid rgba(255,255,255,.28);border-radius:18px;background:rgba(5,12,38,.78);box-shadow:0 10px 28px rgba(0,0,0,.3);backdrop-filter:blur(12px)}.earth-orbit-v01-actions button{min-height:43px;border:0;border-radius:12px;padding:10px 17px;background:linear-gradient(90deg,#6657df,#22b9d0);color:#fff;font:900 13px/1.2 inherit;cursor:pointer}.earth-orbit-v01-actions button:not(:first-child){border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.12)}.earth-orbit-v01-tips-toggle{position:absolute;z-index:5;right:18px;top:18px;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:10px 15px;background:rgba(8,18,54,.7);color:#fff;font:900 12px/1 inherit;cursor:pointer;backdrop-filter:blur(12px)}.earth-orbit-v01-tips-toggle[hidden]{display:none}.earth-orbit-v01-tips{position:absolute;z-index:6;right:18px;top:18px;width:min(330px,calc(100% - 36px));padding:17px;border:1px solid rgba(210,226,255,.4);border-radius:22px;background:rgba(8,18,54,.7);box-shadow:0 18px 50px rgba(3,8,30,.32);color:#f4f8ff;backdrop-filter:blur(14px)}.earth-orbit-v01-tips[hidden]{display:none}.earth-orbit-v01-tips-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.earth-orbit-v01-tips h2{margin:0;font-size:19px}.earth-orbit-v01-tips-close{border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:8px 11px;background:rgba(255,255,255,.12);color:#fff;font:900 11px/1 inherit;cursor:pointer}.earth-orbit-v01-tips>p{margin:8px 0 12px;color:#cbd8ee;font-size:12px;font-weight:750;line-height:1.55}.earth-orbit-v01-readout{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0}.earth-orbit-v01-readout div{display:grid;gap:3px;padding:9px;border:1px solid rgba(219,229,241,.28);border-radius:12px;background:rgba(255,255,255,.1)}.earth-orbit-v01-readout dt{color:#bdcae2;font-size:10px;font-weight:900}.earth-orbit-v01-readout dd{margin:0;color:#fff;font-size:11px;font-weight:1000}.earth-orbit-v01-note{margin:10px 0 0!important;padding:9px;border-radius:12px;background:rgba(255,222,100,.16);color:#fff0aa!important;font-size:11px!important}@media(max-width:820px){.acceptance-head p,.acceptance-badge{display:none}.earth-orbit-v01-stage{height:calc(100vh - 65px);min-height:430px}.earth-orbit-v01-hint{font-size:10px}.earth-orbit-v01-actions{bottom:10px}.earth-orbit-v01-actions button{padding:9px 12px}.earth-orbit-v01-tips,.earth-orbit-v01-tips-toggle{top:10px;right:10px}}@media(max-width:520px){.earth-orbit-v01-stage{min-height:420px}.earth-orbit-v01-actions{width:auto;justify-content:center}.earth-orbit-v01-actions button{padding-inline:12px}}
  </style>
  <style>.earth-orbit-v01-loading{position:absolute;z-index:9;inset:0;display:grid;place-items:center;margin:0;background:rgba(3,8,26,.82);color:#e9f7ff;font-size:15px;font-weight:900}.earth-orbit-v01-loading[hidden]{display:none}.earth-orbit-v01-canvas:focus-visible{outline:4px solid #ffd75f;outline-offset:-7px}</style>
</head>
<body>
  <main class="acceptance">
    <header class="acceptance-head"><div><p>地球科學互動實驗</p><h1>地球公轉</h1></div><span class="acceptance-badge">可直接操作</span></header>
    <section class="earth-orbit-v01-shell" data-earth-orbit-v01>
      <div class="earth-orbit-v01-stage">
        <p class="earth-orbit-v01-loading" data-orbit-loading>正在載入互動場景…</p><p class="earth-orbit-v01-hint">拖曳地球觀察公轉・月球繞地球運行</p>
        <div class="earth-orbit-v01-actions"><button type="button" data-orbit-action="toggle" aria-pressed="true">Ⅱ 暫停</button><button type="button" data-orbit-action="reset">↺ 重新開始</button></div>
        <button class="earth-orbit-v01-tips-toggle" type="button" data-orbit-action="tips" hidden>觀察提示⌄</button>
        <aside class="earth-orbit-v01-tips" data-orbit-tips><div class="earth-orbit-v01-tips-head"><h2>觀察提示</h2><button class="earth-orbit-v01-tips-close" type="button" data-orbit-action="close-tips" aria-label="收起提示">收起⌃</button></div><p>地球持續自轉並繞太陽公轉；月球約 27.3 日繞地球一圈。拖曳地球可以停在想觀察的位置。</p><dl class="earth-orbit-v01-readout"><div><dt>地球公轉天數</dt><dd><output data-orbit-days>0 天</output></dd></div><div><dt>時間尺度</dt><dd><output data-time-scale>計算中</output></dd></div><div><dt>地球自轉</dt><dd><output data-earth-turns>0.00 圈</output></dd></div><div><dt>月球繞行</dt><dd><output data-moon-orbits>0.00 圈</output></dd></div></dl><p class="earth-orbit-v01-note">亮面永遠朝向太陽；地軸維持 23.5° 傾斜。</p></aside>
      </div>
    </section>
  </main>
</body>
</html>
